server {
    listen 80;
    server_name local.domain www.local.domain;

    # if ($host = local.domain) { return 301 http://local.domain$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        # proxy_redirect http://127.0.0.1:8000 /; proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        access_log off ;
        gzip on;
    }

    
}

server {
    listen 443 ssl;
    server_name local.domain www.local.domain;

    ssl_certificate     /etc/ssl/certs/local.domain.pem;
    ssl_certificate_key /etc/ssl/private/local.domain.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1; 
    }
}

